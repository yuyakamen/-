<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>マリオ風ゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      display: flex;
      gap: 24px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 0 4px;
      text-shadow: 2px 2px 4px #000;
    }
    #canvas-wrap {
      width: 100%;
      max-width: 800px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border: 3px solid #fff;
      border-radius: 4px;
    }
    #message {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
      text-shadow: 2px 2px 4px #000;
      height: 24px;
      text-align: center;
    }
    #touch-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      padding: 12px 16px;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .btn-group { display: flex; gap: 12px; }
    .btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .btn:active, .btn.pressed {
      background: rgba(255,255,255,0.4);
    }
    #btn-jump {
      width: 72px;
      height: 72px;
      background: rgba(255, 80, 80, 0.3);
      border-color: rgba(255,150,150,0.8);
      font-size: 28px;
    }
    @media (max-width: 600px) {
      #touch-controls { display: flex; }
      #ui { font-size: 14px; gap: 16px; }
    }
    @media (pointer: coarse) {
      #touch-controls { display: flex; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <span>スコア: <span id="score">0</span></span>
    <span>コイン: <span id="coins">0</span></span>
    <span>ライフ: <span id="lives">3</span></span>
  </div>
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>
  <div id="message"></div>

  <div id="touch-controls">
    <div class="btn-group">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn" id="btn-jump">↑</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
