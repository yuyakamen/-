<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>テトリス</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      touch-action: none;
      user-select: none;
    }
    h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #4fc3f7;
      letter-spacing: 4px;
    }
    #game-area {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    #board-wrap {
      position: relative;
    }
    canvas#board {
      border: 3px solid #4fc3f7;
      border-radius: 4px;
      display: block;
      box-shadow: 0 0 20px rgba(79,195,247,0.4);
    }
    #side {
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: #fff;
      min-width: 120px;
    }
    .side-box {
      background: rgba(255,255,255,0.08);
      border: 2px solid #4fc3f7;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .side-box h3 {
      font-size: 0.75rem;
      color: #4fc3f7;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }
    .side-box p {
      font-size: 1.4rem;
      font-weight: bold;
    }
    canvas#next {
      display: block;
      margin-top: 4px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
    }
    #overlay h2 {
      color: #ffd600;
      font-size: 2rem;
      text-shadow: 0 0 10px #ffd600;
      margin-bottom: 10px;
    }
    #overlay p {
      color: #fff;
      font-size: 1rem;
    }
    #touch-controls {
      display: none;
      margin-top: 14px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .btn-row { display: flex; gap: 12px; }
    .btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(79,195,247,0.7);
      background: rgba(79,195,247,0.15);
      color: white;
      font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .btn:active, .btn.pressed { background: rgba(79,195,247,0.45); }
    #btn-drop { background: rgba(255,80,80,0.25); border-color: rgba(255,150,150,0.8); }
    #btn-drop:active { background: rgba(255,80,80,0.55); }
    @media (max-width: 600px), (pointer: coarse) {
      #touch-controls { display: flex; }
      h1 { font-size: 1.4rem; }
      #side { min-width: 90px; }
    }
  </style>
</head>
<body>
  <h1>テトリス</h1>
  <div id="game-area">
    <div id="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay">
        <h2>テトリス！</h2>
        <p>スペース / タップで スタート</p>
      </div>
    </div>
    <div id="side">
      <div class="side-box">
        <h3>スコア</h3>
        <p id="score">0</p>
      </div>
      <div class="side-box">
        <h3>レベル</h3>
        <p id="level">1</p>
      </div>
      <div class="side-box">
        <h3>ライン</h3>
        <p id="lines">0</p>
      </div>
      <div class="side-box">
        <h3>つぎ</h3>
        <canvas id="next" width="100" height="100"></canvas>
      </div>
    </div>
  </div>
  <div id="touch-controls">
    <div class="btn-row">
      <div class="btn" id="btn-rotate">↺</div>
    </div>
    <div class="btn-row">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn-row">
      <div class="btn" id="btn-drop">⬇</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
