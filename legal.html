<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特定商取引法に基づく表記｜Mr.sasuken</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">Mr.sasuken</a>
  </header>

  <main>
    <section>
      <h2>特定商取引法に基づく表記</h2>
      <p class="lead">
        以下の項目は、下部の <code>js/config.js</code> の値を使って自動表示されます。
        公開前に、必ずすべて実際の情報に書き換えてください（未記入のまま公開しないでください）。
      </p>
      <table class="legal-table">
        <tr>
          <th>販売事業者</th>
          <td id="legal-name"></td>
        </tr>
        <tr>
          <th>運営責任者</th>
          <td id="legal-rep"></td>
        </tr>
        <tr>
          <th>所在地</th>
          <td id="legal-address"></td>
        </tr>
        <tr>
          <th>電話番号</th>
          <td id="legal-phone"></td>
        </tr>
        <tr>
          <th>メールアドレス</th>
          <td id="legal-email"></td>
        </tr>
        <tr>
          <th>販売価格</th>
          <td id="legal-price"></td>
        </tr>
        <tr>
          <th>商品代金以外の必要料金</th>
          <td id="legal-extra-fee"></td>
        </tr>
        <tr>
          <th>お支払い方法</th>
          <td id="legal-payment"></td>
        </tr>
        <tr>
          <th>お支払い時期</th>
          <td id="legal-payment-timing"></td>
        </tr>
        <tr>
          <th>商品の引き渡し時期</th>
          <td id="legal-delivery"></td>
        </tr>
        <tr>
          <th>返品・キャンセルについて</th>
          <td id="legal-refund"></td>
        </tr>
      </table>
    </section>
    <a class="back-link" href="index.html">← 販売ページに戻る</a>
  </main>

  <footer>
    <p id="copyright"></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/legal.js"></script>
</body>
</html>
